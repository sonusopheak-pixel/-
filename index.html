<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvKz4kcj-HznHfO9wsCz6MzR_mUYWP9hZiLxBDvPwm7Tr90JqZXBGxAbNiGi5m4-mj/exec";
    let cart = [];

    window.onload = function() {
      // 1. ឆែកមើលបើមានទិន្នន័យចាស់ក្នុងទូរស័ព្ទ គឺបង្ហាញភ្លាម
      const localData = localStorage.getItem("LOCAL_PRODUCTS");
      if (localData) {
        try { 
          renderProducts(JSON.parse(localData)); 
        } catch(e){}
      }

      // 2. បើកកងស្វែងរកទិន្នន័យពី Server
      fetchDataFromServer();
    };

    function fetchDataFromServer() {
      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleServerResponse";
      script.onerror = function() {
        // បើមានបញ្ហាអនឡាញ ឱ្យព្យាយាមទាញម្តងទៀតស្វ័យប្រវត្តិក្រោយ ២ វិនាទី
        setTimeout(fetchDataFromServer, 2000);
      };
      document.body.appendChild(script);
    }

    function handleServerResponse(products) {
      if (products && products.length > 0) {
        localStorage.setItem("LOCAL_PRODUCTS", JSON.stringify(products));
        renderProducts(products);
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('main-content');
      if (!products || products.length === 0) {
        container.innerHTML = "<div class='loading'>គ្មានទំនិញក្នុងស្តុកឡើយ</div>";
        return;
      }

      const categories = {};
      products.forEach(p => {
        let cat = p.category ? p.category.toString().trim() : 'ទំនិញទូទៅ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      let fullHtml = '';
      for (let catName in categories) {
        fullHtml += `
          <div class="section-container">
            <div class="section-title"><i>${catName}</i></div>
            <div class="product-grid">
        `;
        categories[catName].forEach(p => {
          let imgUrl = p.image && p.image.toString().startsWith('http') ? p.image : 'https://picsum.photos/300/300';
          let descText = (p.description && p.description !== "-") ? p.description : '';
          fullHtml += `
            <div class="product-card">
              <div class="image-wrapper"><img src="${imgUrl}" alt="${p.name}" loading="lazy"></div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                ${descText ? `<div class="product-desc">${descText}</div>` : ''}
                <div class="price-tag">$${p.price}</div>
              </div>
              <button class="btn-add-cart" onclick="addToCart('${p.name}', ${p.price})">+ ថែមចូលកន្ត្រក</button>
            </div>
          `;
        });
        fullHtml += `</div></div>`;
      }
      container.innerHTML = fullHtml;
    }

    function addToCart(name, price) {
      cart.push({ name, price: Number(price) });
      document.getElementById('cart-count').innerText = cart.length;
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = '$' + total;
      alert("បានបន្ថែម " + name + " ទៅក្នុងកន្ត្រក!");
    }

    function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      if (!name || !phone) return alert("សូមបញ្ចូលឈ្មោះ និងលេខទូរស័ព្ទ!");
      if (cart.length === 0) return alert("សូមបន្ថែមទំនិញចូលកន្ត្រកមុនបញ្ជូន!");

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
      const itemsText = cart.map(i => i.name).join(", ");
      const btn = document.querySelector('.btn-submit');
      btn.innerText = "កំពុងបញ្ជូន...";
      btn.disabled = true;

      const orderUrl = API_URL + "?action=submitOrder&name=" + encodeURIComponent(name) + 
                       "&phone=" + encodeURIComponent(phone) + 
                       "&items=" + encodeURIComponent(itemsText) + 
                       "&totalPrice=" + encodeURIComponent(totalPrice) + 
                       "&callback=onOrderSuccess";

      const script = document.createElement('script');
      script.src = orderUrl;
      document.body.appendChild(script);
    }

    function onOrderSuccess() {
      alert("🎉 ការកុម្ម៉ង់ជោគជ័យ!");
      cart = [];
      document.getElementById('cart-count').innerText = '0';
      document.getElementById('cart-total').innerText = '$0';
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      const btn = document.querySelector('.btn-submit');
      btn.innerText = "បញ្ជាទិញភ្លាមៗ";
      btn.disabled = false;
    }
  </script>
