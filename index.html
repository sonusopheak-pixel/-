<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ហាងទំនិញ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: #f4f4f4; 
      margin: 0; 
      padding: 8px 8px 75px 8px !important;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px; 
    }

    .banner-slider {
      position: relative;
      width: 100%;
      height: auto;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .banner-slide {
      position: relative;
      width: 100%;
      height: auto;
      display: none;
    }

    .banner-slide.active {
      display: block;
    }

    .banner-slide img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 10px;
    }

    .header-social-box {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .marquee-container {
      background-color: #fff8e7;
      border: 1px solid #ffe0b2;
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 8px;
      overflow: hidden;
      font-size: 11px;
      font-weight: bold;
      color: #d35400;
    }

    .social-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .magic-text {
      font-size: 12px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff007f, #7928ca, #0070f3, #ff007f);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: magicGlow 3s linear infinite;
      display: inline-block;
      text-shadow: 0 0 8px rgba(121, 40, 202, 0.3);
    }

    @keyframes magicGlow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .social-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.15);
    }

    .social-icon svg {
      width: 100%;
      height: 100%;
    }

    .section-container {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #333;
      margin-bottom: 8px;
    }

    .product-grid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 8px !important;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      align-items: center; 
      text-align: center;   
      background: #fff;
      border-radius: 8px;
      border: 1px solid #f0f0f0;
      padding: 5px;
      overflow: hidden;
      justify-content: space-between;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      overflow: hidden;
      background-color: #eee;
    }

    .image-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .product-info {
      width: 100%;
      margin: 4px 0;
    }

    .product-name {
      font-size: 11px;
      font-weight: 700;
      color: #222;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-tag {
      font-size: 13px;
      font-weight: 800;
      color: #ff4747;
      margin-bottom: 4px;
    }

    .btn-add-cart {
      width: 100%;
      background-color: #ff4747;
      color: white;
      border: none;
      padding: 6px 2px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-out-stock {
      width: 100%;
      background-color: #ccc;
      color: #666;
      border: none;
      padding: 6px 2px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: #fff0f0;
      border: 1px solid #ff4747;
      border-radius: 4px;
    }

    .btn-qty {
      background-color: #ff4747;
      color: white;
      border: none;
      width: 26px;
      height: 24px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .qty-number {
      font-size: 11px;
      font-weight: bold;
      color: #ff4747;
    }

    .view-box {
      background: white;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: none;
    }
    .view-box h3 { margin-top: 0; font-size: 14px; margin-bottom: 8px; }

    .cart-items-container {
      max-height: 220px;
      overflow-y: auto;
      border: 1px dashed #eee;
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 10px;
      background-color: #fafafa;
    }

    .cart-item-row {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .cart-item-row:last-child { border-bottom: none; }

    .cart-item-img {
      width: 45px !important;
      height: 45px !important;
      border-radius: 6px;
      object-fit: cover !important;
      margin-right: 10px;
      background-color: #eee;
      flex-shrink: 0 !important;
    }

    .cart-item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .cart-item-title {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price-info {
      font-size: 11px;
      color: #777;
      margin-top: 2px;
    }

    .cart-item-subtotal {
      font-size: 12px;
      font-weight: bold;
      color: #ff4747;
      margin-left: 8px;
      white-space: nowrap;
    }

    .empty-msg {
      font-size: 11px;
      color: #999;
      text-align: center;
      padding: 15px 0;
    }

    /* History Card Style */
    .history-card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .status-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .status-waiting { background: #fff3cd; color: #856404; }
    .status-paid { background: #d4edda; color: #155724; }
    .status-delivered { background: #cce5ff; color: #004085; }
    .status-unpaid { background: #f8d7da; color: #721c24; }

    input, select { 
      width: 100%; 
      padding: 8px; 
      margin: 4px 0 10px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 13px; 
      background-color: #fff;
    }

    .btn-submit { 
      width: 100%; 
      background: #27ae60; 
      color: white; 
      border: none; 
      padding: 10px; 
      font-size: 14px; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
    }

    .loading { text-align: center; color: #777; padding: 15px; grid-column: 1 / -1; font-size: 12px; }

    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100% !important;
      height: 60px !important;
      background-color: #1b4d3e !important;
      display: flex !important;
      justify-content: space-around !important;
      align-items: center !important;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.2) !important;
      z-index: 2147483647 !important;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 10px;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      flex: 1;
      height: 100%;
      position: relative;
    }

    .nav-item.active {
      color: #2ecc71;
    }

    .nav-icon-emoji {
      font-size: 16px;
      margin-bottom: 2px;
      line-height: 1;
    }

    .badge-count {
      position: absolute;
      top: 4px;
      right: 22%;
      background-color: #ff4747;
      color: white;
      border-radius: 10px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. Home View -->
    <div id="home-view">
      <div id="banner-slider" class="banner-slider">
        <div class="banner-slide active"><img src="https://picsum.photos/600/200" alt="Sponsor"></div>
      </div>

      <div class="header-social-box">
        <div class="marquee-container">
          <marquee id="announcement-text" behavior="scroll" direction="left" scrollamount="4">
            🎉 កំពុងផ្ទុកព័ត៌មាន...
          </marquee>
        </div>

        <div class="social-row">
          <span class="header-title magic-text">✨ ទំនាក់ទំនងយើង៖</span>
          <div class="social-links">
            <a id="link-fb" href="#" target="_blank" class="social-icon" title="Facebook">
              <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </a>
            <a id="link-tg" href="#" target="_blank" class="social-icon" title="Telegram">
              <svg viewBox="0 0 24 24" fill="#24A1DE"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.03 9.56c-.15.68-.56.84-1.13.53l-3.1-2.29-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.35-.39-.13l-7.14 4.5-3.08-.96c-.67-.21-.68-.67.14-.99l12.03-4.64c.56-.21 1.05.13.84.95z"/></svg>
            </a>
            <a id="link-line" href="#" target="_blank" class="social-icon" title="LINE">
              <svg viewBox="0 0 24 24" fill="#00B900"><path d="M19.34 10.03c0-3.89-3.79-7.05-8.47-7.05-4.68 0-8.47 3.16-8.47 7.05 0 3.48 3.01 6.39 7.08 6.95.28.06.65.18.75.42.08.21.05.53.03.74-.04.26-.18.99-.2 1.2-.03.28-.15 1.08.95.59 1.1-.49 5.92-3.49 8.08-5.97 1.08-1.2 1.76-2.5 1.76-3.93zm-12.72 1.63h-1.34c-.21 0-.38-.17-.38-.38v-2.33c0-.21.17-.38.38-.38h1.34c.21 0 .38.17.38.38v.52c0 .21-.17.38-.38.38h-.82v.28h.82c.21 0 .38.17.38.38v.52c0 .21-.17.38-.38.38zm2.46 0h-.52c-.21 0-.38-.17-.38-.38v-2.33c0-.21.17-.38.38-.38h.52c.21 0 .38.17.38.38v2.33c0 .21-.17.38-.38.38zm3.2 0h-.52c-.15 0-.28-.09-.34-.22l-1.12-1.57v1.41c0 .21-.17.38-.38.38h-.52c-.21 0-.38-.17-.38-.38v-2.33c0-.21.17-.38.38-.38h.52c.15 0 .28.09.34.22l1.12 1.57v-1.41c0-.21.17-.38.38-.38h.52c.21 0 .38.17.38.38v2.33c0 .21-.17.38-.38.38zm2.84-1.05h-.82v-.28h.82c.21 0 .38-.17.38-.38v-.52c0-.21-.17-.38-.38-.38h-1.34c-.21 0-.38.17-.38.38v2.33c0 .21.17.38.38.38h1.34c.21 0 .38-.17.38-.38v-.52c0-.21-.17-.38-.38-.38z"/></svg>
            </a>
            <a id="link-tt" href="#" target="_blank" class="social-icon" title="TikTok">
              <svg viewBox="0 0 24 24" fill="#000000"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.55-1.32 1.48-1.34 2.47-.04 1.25.7 2.45 1.83 2.87 1.16.45 2.53.22 3.48-.56.88-.7 1.34-1.8 1.33-2.92.02-5.26.01-10.53.01-15.79z"/></svg>
            </a>
            <a id="link-yt" href="#" target="_blank" class="social-icon" title="YouTube">
              <svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </a>
          </div>
        </div>
      </div>

      <div id="main-content">
        <div class="loading">កំពុងផ្ទុកទំនិញ...</div>
      </div>
    </div>

    <!-- 2. Order Box View -->
    <div id="order-box" class="view-box">
      <h3>🛒 បញ្ជូនការកុម្ម៉ង់ទិញ</h3>
      
      <div id="cart-items-list" class="cart-items-container">
        <div class="empty-msg">មិនទាន់មានទំនិញក្នុងកន្ត្រកឡើយ</div>
      </div>

      <div style="margin-bottom: 8px; font-size: 12px; font-weight: bold; text-align: right;">
        កន្ត្រក៖ <span id="cart-count" style="color:#27ae60;">0</span> មុខ | សរុប៖ <span id="cart-total" style="color:#ff4747;">$0</span>
      </div>
      
      <label style="font-size: 11px; font-weight: bold;">ឈ្មោះរបស់អ្នក <span style="color:red;">*</span></label>
      <input type="text" id="custName" placeholder="បញ្ចូលឈ្មោះ...">

      <label style="font-size: 11px; font-weight: bold;">លេខទូរស័ព្ទ <span style="color:red;">*</span></label>
      <input type="tel" id="custPhone" placeholder="បញ្ចូលលេខទូរស័ព្ទ...">

      <label style="font-size: 11px; font-weight: bold;">អាសយដ្ឋានដឹកជញ្ជូន (Address) <span style="color:red;">*</span></label>
      <input type="text" id="custAddress" placeholder="បញ្ចូលទីតាំង/អាសយដ្ឋាន...">

      <label style="font-size: 11px; font-weight: bold;">សេវាដឹកជញ្ជូន (Delivery Service) <span style="color:red;">*</span></label>
      <select id="deliveryType">
        <option value="">-- សូមជ្រើសរើសក្រុមហ៊ុនដឹកជញ្ជូន --</option>
        <option value="J&T Express">J&T Express</option>
        <option value="វីរៈប៊ុនថាំ (Virak Buntham)">វីរៈប៊ុនថាំ (Virak Buntham)</option>
        <option value="ភ្នំពេញតាក់ស៊ី (Phnom Penh Taxi)">ភ្នំពេញតាក់ស៊ី (Phnom Penh Taxi)</option>
        <option value="ដឹកជញ្ជូនទូទៅ (General Delivery)">ដឹកជញ្ជូនទូទៅ (General Delivery)</option>
      </select>

      <button class="btn-submit" onclick="submitOrder()">បញ្ជាទិញភ្លាមៗ</button>
    </div>

    <!-- 3. History View (ប្រវត្តិកុម្ម៉ង់) -->
    <div id="history-box" class="view-box">
      <h3>📜 ប្រវត្តិការកុម្ម៉ង់ទិញរបស់ខ្ញុំ</h3>
      <div id="history-list-container">
        <div class="empty-msg">⏳ កំពុងផ្ទុកប្រវត្តិកុម្ម៉ង់...</div>
      </div>
    </div>

  </div>

  <!-- 📱 Bottom Navigation Bar (4 Buttons) -->
  <div class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <span class="nav-icon-emoji">🏠</span>
      <span>ទំព័រដើម</span>
    </button>
    <button class="nav-item" id="nav-order" onclick="switchTab('order')">
      <span id="nav-cart-badge" class="badge-count">0</span>
      <span class="nav-icon-emoji">🛒</span>
      <span>ការកុម្ម៉ង់</span>
    </button>
    <button class="nav-item" id="nav-history" onclick="switchTab('history')">
      <span class="nav-icon-emoji">📜</span>
      <span>ប្រវត្តិ</span>
    </button>
    <a href="#" target="_blank" class="nav-item" id="nav-contact">
      <span class="nav-icon-emoji">💬</span>
      <span>ទំនាក់ទំនង</span>
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentStoreId = urlParams.get('store') || 'main_shop';

    const BASE_API_URL = "https://script.google.com/macros/s/AKfycbxRisA9I_OlAWZHt-vxWrvcNPwizPbDdqDklIqVZnvk9Iutd9OlWy4PcIQLOgFzVj6W/exec";
    const API_URL = BASE_API_URL + "?store=" + currentStoreId;

    let cart = {}; 
    let allProducts = [];
    let slideIndex = 0;
    let slideTimer = null;
    let buyerChatId = null;
    let buyerUsername = "";

    window.onload = function() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
        const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        if (tgUser) {
          if (tgUser.id) buyerChatId = tgUser.id;
          if (tgUser.username) buyerUsername = tgUser.username;
        }
      }

      const localData = localStorage.getItem("LOCAL_PRODUCTS_" + currentStoreId);
      if (localData) {
        try { 
          allProducts = JSON.parse(localData);
          renderProducts(allProducts); 
        } catch(e){}
      }
      fetchDataFromServer();
    };

    function switchTab(tabName) {
      const homeView = document.getElementById('home-view');
      const orderBox = document.getElementById('order-box');
      const historyBox = document.getElementById('history-box');

      const navHome = document.getElementById('nav-home');
      const navOrder = document.getElementById('nav-order');
      const navHistory = document.getElementById('nav-history');

      homeView.style.display = 'none';
      orderBox.style.display = 'none';
      historyBox.style.display = 'none';

      navHome.classList.remove('active');
      navOrder.classList.remove('active');
      navHistory.classList.remove('active');

      if (tabName === 'home') {
        homeView.style.display = 'block';
        navHome.classList.add('active');
      } else if (tabName === 'order') {
        orderBox.style.display = 'block';
        navOrder.classList.add('active');
      } else if (tabName === 'history') {
        historyBox.style.display = 'block';
        navHistory.classList.add('active');
        fetchHistoryFromServer();
      }
    }

    function fetchDataFromServer() {
      const script = document.createElement('script');
      script.src = API_URL + "&t=" + new Date().getTime() + "&callback=handleServerResponse";
      document.body.appendChild(script);
    }

    function handleServerResponse(response) {
      if (response) {
        if (response.storeName) {
          document.title = response.storeName;
        }
        if (response.banners && response.banners.length > 0) renderBanners(response.banners);
        if (response.announcement) document.getElementById('announcement-text').innerText = response.announcement;
        
        if (response.socials) {
          const tgUrl = response.socials.telegram || "#";
          document.getElementById('link-fb').href = response.socials.facebook || "#";
          document.getElementById('link-tg').href = tgUrl;
          document.getElementById('link-line').href = response.socials.line || "#";
          document.getElementById('link-tt').href = response.socials.tiktok || "#";
          document.getElementById('link-yt').href = response.socials.youtube || "#";

          // 🔗 កំណត់ Link ឱ្យប៊ូតុង "ទំនាក់ទំនង" ខាងក្រោមដោយស្វ័យប្រវត្តិ
          document.getElementById('nav-contact').href = tgUrl;
        }

        if (response.products) {
          allProducts = response.products;
          localStorage.setItem("LOCAL_PRODUCTS_" + currentStoreId, JSON.stringify(response.products));
          renderProducts(response.products);
        }
      }
    }

    function fetchHistoryFromServer() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = "<div class='empty-msg'>⏳ កំពុងផ្ទុកប្រវត្តិកុម្ម៉ង់...</div>";

      const script = document.createElement('script');
      script.src = API_URL + "&action=getHistory&buyerChatId=" + encodeURIComponent(buyerChatId || "") + "&t=" + new Date().getTime() + "&callback=handleHistoryResponse";
      document.body.appendChild(script);
    }

    function handleHistoryResponse(res) {
      const container = document.getElementById('history-list-container');
      if (!res || !res.history || res.history.length === 0) {
        container.innerHTML = "<div class='empty-msg'>📭 មិនទាន់មានប្រវត្តិបញ្ជាទិញឡើយ!</div>";
        return;
      }

      let html = '';
      res.history.forEach(item => {
        let statusClass = 'status-waiting';
        let statusText = '⏳ រង់ចាំពិនិត្យ';

        if (item.status === 'PAID') { statusClass = 'status-paid'; statusText = '✅ បានទូទាត់'; }
        else if (item.status === 'DELIVERED') { statusClass = 'status-delivered'; statusText = '🚚 បានដឹកជញ្ជូន'; }
        else if (item.status === 'UNPAID') { statusClass = 'status-unpaid'; statusText = '❌ បដិសេធ'; }

        html += `
          <div class="history-card">
            <div class="history-header">
              <span>កូដ៖ #${item.orderId}</span>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
            <div style="font-size:11px; color:#555; margin-bottom:4px;">📅 ${item.date}</div>
            <div style="font-size:12px; font-weight:bold; color:#222;">👕 ${item.items}</div>
            <div style="font-size:12px; font-weight:bold; color:#ff4747; margin-top:4px;">💰 សរុប៖ $${item.totalPrice}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderBanners(bannerUrls) {
      const slider = document.getElementById('banner-slider');
      let html = '';
      bannerUrls.forEach((url, index) => {
        html += `<div class="banner-slide ${index === 0 ? 'active' : ''}"><img src="${url}" alt="Sponsor ${index}"></div>`;
      });
      slider.innerHTML = html;

      if (slideTimer) clearInterval(slideTimer);
      if (bannerUrls.length > 1) {
        slideTimer = setInterval(() => {
          const slides = document.querySelectorAll('.banner-slide');
          if (slides.length > 0) {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
          }
        }, 3500);
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('main-content');
      if (!products || products.length === 0) {
        container.innerHTML = "<div class='loading'>គ្មានទំនិញក្នុងស្តុកឡើយ</div>";
        return;
      }

      const categories = {};
      products.forEach(p => {
        let cat = p.category ? p.category.toString().trim() : 'ទំនិញទូទៅ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      let fullHtml = '';
      for (let catName in categories) {
        fullHtml += `<div class="section-container"><div class="section-title"><i>${catName}</i></div><div class="product-grid">`;
        categories[catName].forEach(p => {
          let imgUrl = p.image && p.image.toString().startsWith('http') ? p.image : 'https://picsum.photos/300/300';
          let pId = p.id;
          let qty = cart[pId] ? cart[pId].qty : 0;
          let isOutOfStock = (p.status === "OUT_OF_STOCK");

          fullHtml += `
            <div class="product-card">
              <div class="image-wrapper"><img src="${imgUrl}" alt="${p.name}" loading="lazy"></div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price-tag">$${p.price}</div>
              </div>
              <div id="btn-container-${pId}" style="width:100%;">
                ${isOutOfStock ? `<button class="btn-out-stock" disabled>អស់ស្តុក</button>` : renderButtonHtml(pId, p.name, p.price, imgUrl, qty)}
              </div>
            </div>
          `;
        });
        fullHtml += `</div></div>`;
      }
      container.innerHTML = fullHtml;
    }

    function renderButtonHtml(id, name, price, img, qty) {
      if (qty > 0) {
        return `
          <div class="qty-control">
            <button class="btn-qty" onclick="changeQty('${id}', '${name}', ${price}, '${img}', -1)">-</button>
            <span class="qty-number">${qty}</span>
            <button class="btn-qty" onclick="changeQty('${id}', '${name}', ${price}, '${img}', 1)">+</button>
          </div>
        `;
      } else {
        return `<button class="btn-add-cart" onclick="changeQty('${id}', '${name}', ${price}, '${img}', 1)">+ ថែមចូលកន្ត្រក</button>`;
      }
    }

    function changeQty(id, name, price, img, delta) {
      if (!cart[id]) cart[id] = { name: name, price: Number(price), img: img, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const btnContainer = document.getElementById('btn-container-' + id);
      if (btnContainer) {
        let currentQty = cart[id] ? cart[id].qty : 0;
        btnContainer.innerHTML = renderButtonHtml(id, name, price, img, currentQty);
      }
      updateCartSummary();
    }

    function updateCartSummary() {
      let totalCount = 0;
      let totalPrice = 0;
      let cartItemsHtml = '';

      const keys = Object.keys(cart);
      if (keys.length === 0) {
        cartItemsHtml = '<div class="empty-msg">មិនទាន់មានទំនិញក្នុងកន្ត្រកឡើយ</div>';
      } else {
        keys.forEach(key => {
          let item = cart[key];
          let itemSubtotal = item.qty * item.price;
          totalCount += item.qty;
          totalPrice += itemSubtotal;

          cartItemsHtml += `
            <div class="cart-item-row">
              <img src="${item.img}" class="cart-item-img" alt="${item.name}">
              <div class="cart-item-details">
                <div class="cart-item-title">${item.name}</div>
                <div class="cart-item-price-info">$${item.price} x ${item.qty}</div>
              </div>
              <div class="cart-item-subtotal">$${itemSubtotal}</div>
            </div>
          `;
        });
      }

      document.getElementById('cart-items-list').innerHTML = cartItemsHtml;
      document.getElementById('cart-count').innerText = totalCount;
      document.getElementById('cart-total').innerText = '$' + totalPrice;

      const badge = document.getElementById('nav-cart-badge');
      if (totalCount > 0) {
        badge.innerText = totalCount;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const deliveryType = document.getElementById('deliveryType').value.trim();

      if (!name) return alert("សូមបញ្ចូលឈ្មោះរបស់អ្នក!");
      if (!phone) return alert("សូមបញ្ចូលលេខទូរស័ព្ទ!");
      if (!address) return alert("សូមបញ្ចូលអាសយដ្ឋានដឹកជញ្ជូន!");
      if (!deliveryType) return alert("សូមជ្រើសរើសក្រុមហ៊ុនដឹកជញ្ជូន!");

      let itemsArray = [];
      let totalPrice = 0;
      for (let key in cart) {
        itemsArray.push(cart[key].name + " (x" + cart[key].qty + ")");
        totalPrice += cart[key].qty * cart[key].price;
      }

      if (itemsArray.length === 0) return alert("សូមបន្ថែមទំនិញចូលកន្ត្រកមុនបញ្ជូន!");

      const btn = document.querySelector('.btn-submit');
      btn.innerText = "កំពុងបញ្ជូន...";
      btn.disabled = true;

      const itemsText = itemsArray.join(", ");
      const orderUrl = API_URL + "&action=submitOrder&name=" + encodeURIComponent(name) + 
                       "&phone=" + encodeURIComponent(phone) + 
                       "&address=" + encodeURIComponent(address) + 
                       "&deliveryType=" + encodeURIComponent(deliveryType) + 
                       "&items=" + encodeURIComponent(itemsText) + 
                       "&totalPrice=" + encodeURIComponent(totalPrice) + 
                       "&buyerChatId=" + encodeURIComponent(buyerChatId || "") +
                       "&buyerUsername=" + encodeURIComponent(buyerUsername || "") +
                       "&callback=onOrderSuccess";

      const scriptOrder = document.createElement('script');
      scriptOrder.src = orderUrl;
      document.body.appendChild(scriptOrder);
    }

    function onOrderSuccess(res) {
      const btn = document.querySelector('.btn-submit');

      if (res && res.status === "blocked") {
        alert("⚠️ អ្នកមានការកុម្ម៉ង់ជំពាក់ដែលមិនទាន់ទូទាត់! សូមទាក់ទងអ្នកលក់មុនធ្វើការកុម្ម៉ង់ថ្មី។");
        btn.innerText = "បញ្ជាទិញភ្លាមៗ";
        btn.disabled = false;
        return;
      }

      alert("🎉 ការកុម្ម៉ង់ជោគជ័យ! វិក្កយបត្រត្រូវបានផ្ញើចូល Telegram របស់អ្នក។");
      cart = {};
      updateCartSummary();
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custAddress').value = '';
      document.getElementById('deliveryType').value = '';
      btn.innerText = "បញ្ជាទិញភ្លាមៗ";
      btn.disabled = false;
      
      switchTab('history');
    }
  </script>
</body>
</html>
