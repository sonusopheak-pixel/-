<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ហាងទំនិញ - Web App</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #222222);
      padding: 15px;
    }

    .header {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
    }

    .store-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--tg-theme-button-color, #0088cc);
    }

    .store-id-badge {
      display: inline-block;
      font-size: 12px;
      background: #eef2f5;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 5px;
      color: #666;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="store-title" id="shopName">កំពុងទាញយកព័ត៌មានហាង...</div>
    <div class="store-id-badge" id="shopIdBadge">Store ID: -</div>
  </div>

  <div id="loadingState" class="loading">⏳ កំពុងផ្ទុកទំនិញ...</div>
  <div id="productGrid" class="product-grid" style="display: none;"></div>

  <script>
    // 1. ភ្ជាប់ Telegram Mini App SDK
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. ទាញយក Store ID ពី URL (ឧទាហរណ៍៖ ?store=shop_1364)
    function getStoreId() {
      const urlParams = new URLSearchParams(window.location.search);
      let storeId = urlParams.get('store');

      // ប្រសិនបើបើកតាម Telegram start_param
      if (!storeId && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        storeId = tg.initDataUnsafe.start_param;
      }

      return storeId || 'main_shop';
    }

    const currentStoreId = getStoreId();
    document.getElementById('shopIdBadge').innerText = "Store ID: " + currentStoreId;

    // 3. Link Google Apps Script Web App របស់អ្នកសម្រាប់ទាញយកទំនិញ
    const API_URL = "https://script.google.com/macros/s/AKfycbxRisA9I_OlAWZHt-vxWrvcNPwizPbDdqDklIqVZnvk9Iutd9OlWy4PcIQLOgFzVj6W/exec?store=" + currentStoreId;

    // 4. ទាញយកទិន្នន័យទំនិញតាម Store ID
    async function loadStoreProducts() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('productGrid').style.display = 'grid';

        if (data.storeName) {
          document.getElementById('shopName').innerText = data.storeName;
        } else {
          document.getElementById('shopName').innerText = "ហាងទំនិញ (" + currentStoreId + ")";
        }

        renderProducts(data.products || []);
      } catch (error) {
        document.getElementById('loadingState').innerText = "❌ មិនអាចទាញយកទិន្នន័យបានឡើយ!";
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('productGrid');
      if (products.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>📭 មិនទាន់មានទំនិញក្នុងហាងនេះឡើយ</p>";
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.image || 'https://via.placeholder.com/100'}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 8px;">
          <h4 style="font-size: 14px; margin: 8px 0 4px;">${p.name}</h4>
          <p style="color: #e53935; font-weight: bold; font-size: 13px;">$${p.price}</p>
        </div>
      `).join('');
    }

    // ដំណើរការទាញយកទិន្នន័យពេលបើកទំព័រ
    loadStoreProducts();
  </script>
</body>
</html>
