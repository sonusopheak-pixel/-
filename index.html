<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ហាងលក់ខោអាវ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: #f4f4f4; 
      margin: 0; 
      padding: 8px; 
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px; 
    }

    /* Sponsor Banner Slideshow */
    .banner-slider {
      position: relative;
      width: 100%;
      height: 130px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      background-color: #ddd;
    }

    .banner-slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .banner-slide.active {
      opacity: 1;
    }

    .banner-slide img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .header-social-box {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .marquee-container {
      background-color: #fff8e7;
      border: 1px solid #ffe0b2;
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 8px;
      overflow: hidden;
      font-size: 11px;
      font-weight: bold;
      color: #d35400;
    }

    .social-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }

    .social-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.15);
    }

    .social-icon svg {
      width: 100%;
      height: 100%;
    }

    .section-container {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #333;
      margin-bottom: 8px;
    }

    .product-grid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 8px !important;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      align-items: center; 
      text-align: center;   
      background: #fff;
      border-radius: 8px;
      border: 1px solid #f0f0f0;
      padding: 5px;
      overflow: hidden;
      justify-content: space-between;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      overflow: hidden;
      background-color: #eee;
    }

    .image-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .product-info {
      width: 100%;
      margin: 4px 0;
    }

    .product-name {
      font-size: 11px;
      font-weight: 700;
      color: #222;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-desc {
      font-size: 9px;
      color: #777;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.2;
    }

    .price-tag {
      font-size: 13px;
      font-weight: 800;
      color: #ff4747;
      margin-bottom: 4px;
    }

    .btn-add-cart {
      width: 100%;
      background-color: #ff4747;
      color: white;
      border: none;
      padding: 6px 2px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: #fff0f0;
      border: 1px solid #ff4747;
      border-radius: 4px;
      overflow: hidden;
    }

    .btn-qty {
      background-color: #ff4747;
      color: white;
      border: none;
      width: 26px;
      height: 24px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-number {
      font-size: 11px;
      font-weight: bold;
      color: #ff4747;
    }

    .order-box {
      background: white;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .order-box h3 { margin-top: 0; font-size: 14px; margin-bottom: 8px; }

    .cart-items-container {
      max-height: 180px;
      overflow-y: auto;
      border: 1px dashed #eee;
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 10px;
      background-color: #fafafa;
    }

    .cart-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .cart-item-row:last-child { border-bottom: none; }

    .cart-item-img {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      margin-right: 8px;
      background-color: #ddd;
    }

    .cart-item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .cart-item-title {
      font-size: 11px;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .cart-item-price-info {
      font-size: 10px;
      color: #777;
    }

    .cart-item-subtotal {
      font-size: 11px;
      font-weight: bold;
      color: #ff4747;
    }

    .empty-cart-msg {
      font-size: 11px;
      color: #999;
      text-align: center;
      padding: 10px 0;
    }

    input { width: 100%; padding: 8px; margin: 4px 0 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    .btn-submit { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .loading { text-align: center; color: #777; padding: 15px; grid-column: 1 / -1; font-size: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Sponsor Banner Slideshow -->
    <div id="banner-slider" class="banner-slider">
      <div class="banner-slide active"><img src="https://picsum.photos/600/200" alt="Sponsor"></div>
    </div>

    <!-- Header ផ្នែកអក្សររត់ & Social Links -->
    <div class="header-social-box">
      <div class="marquee-container">
        <marquee id="announcement-text" behavior="scroll" direction="left" scrollamount="4">
          🎉 កំពុងផ្ទុកព័ត៌មាន...
        </marquee>
      </div>

      <div class="social-row">
        <span class="header-title">ទំនាក់ទំនងយើង៖</span>
        <div class="social-links">
          <a id="link-fb" href="#" target="_blank" class="social-icon" title="Facebook">
            <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </a>
          <a id="link-tg" href="#" target="_blank" class="social-icon" title="Telegram">
            <svg viewBox="0 0 24 24" fill="#24A1DE"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.03 9.56c-.15.68-.56.84-1.13.53l-3.1-2.29-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.35-.39-.13l-7.14 4.5-3.08-.96c-.67-.21-.68-.67.14-.99l12.03-4.64c.56-.21 1.05.13.84.95z"/></svg>
          </a>
          <a id="link-line" href="#" target="_blank" class="social-icon" title="LINE">
            <svg viewBox="0 0 24 24" fill="#00B900"><path d="M19.34 10.03c0-3.89-3.79-7.05-8.47-7.05-4.68 0-8.47 3.16-8.47 7.05 0 3.48 3.01 6.39 7.08 6.95.28.06.65.18.75.42.08.21.05.53.03.74-.04.26-.18.99-.2 1.2-.03.28-.15 1.08.95.59 1.1-.49 5.92-3.49 8.08-5.97 1.08-1.2 1.76-2.5 1.76-3.93zm-12.72 1.63h-1.34c-.21 0-.38-.17-.38-.38v-2.33c0-.21.17-.38.38-.38h1.34c.21 0 .38.17.38.38v.52c0 .21-.17.38-.38.38h-.82v.28h.82c.21 0 .38.17.38.38v.52c0 .21-.17.38-.38.38zm2.46 0h-.52c-.21 0-.38-.17-.38-.38v-2.33c0-.21.17-.38.38-.38h.52c.21 0 .38.17.38.38v2.33c0 .21-.17.38-.38.38zm3.2 0h-.52c-.15 0-.28-.09-.34-.22l-1.12-1.57v1.41c0 .21-.17.38-.38.38h-.52c-.21 0-.38-.17-.38-.38v-2.33c0-.21.17-.38.38-.38h.52c.15 0 .28.09.34.22l1.12 1.57v-1.41c0-.21.17-.38.38-.38h.52c.21 0 .38.17.38.38v2.33c0 .21-.17.38-.38.38zm2.84-1.05h-.82v-.28h.82c.21 0 .38-.17.38-.38v-.52c0-.21-.17-.38-.38-.38h-1.34c-.21 0-.38.17-.38.38v2.33c0 .21.17.38.38.38h1.34c.21 0 .38-.17.38-.38v-.52c0-.21-.17-.38-.38-.38z"/></svg>
          </a>
          <a id="link-tt" href="#" target="_blank" class="social-icon" title="TikTok">
            <svg viewBox="0 0 24 24" fill="#000000"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.55-1.32 1.48-1.34 2.47-.04 1.25.7 2.45 1.83 2.87 1.16.45 2.53.22 3.48-.56.88-.7 1.34-1.8 1.33-2.92.02-5.26.01-10.53.01-15.79z"/></svg>
          </a>
          <a id="link-yt" href="#" target="_blank" class="social-icon" title="YouTube">
            <svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </a>
        </div>
      </div>
    </div>

    <div id="main-content">
      <div class="loading">កំពុងផ្ទុកទំនិញ...</div>
    </div>

    <div class="order-box">
      <h3>🛒 បញ្ជូនការកុម្ម៉ង់ទិញ</h3>
      
      <div id="cart-items-list" class="cart-items-container">
        <div class="empty-cart-msg">មិនទាន់មានទំនិញក្នុងកន្ត្រកឡើយ</div>
      </div>

      <div style="margin-bottom: 8px; font-size: 12px; font-weight: bold; text-align: right;">
        កន្ត្រក៖ <span id="cart-count" style="color:#27ae60;">0</span> មុខ | សរុប៖ <span id="cart-total" style="color:#ff4747;">$0</span>
      </div>
      
      <label style="font-size: 11px; font-weight: bold;">ឈ្មោះរបស់អ្នក</label>
      <input type="text" id="custName" placeholder="បញ្ចូលឈ្មោះ...">

      <label style="font-size: 11px; font-weight: bold;">លេខទូរស័ព្ទ</label>
      <input type="tel" id="custPhone" placeholder="បញ្ចូលលេខទូរស័ព្ទ...">

      <button class="btn-submit" onclick="submitOrder()">បញ្ជាទិញភ្លាមៗ</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvKz4kcj-HznHfO9wsCz6MzR_mUYWP9hZiLxBDvPwm7Tr90JqZXBGxAbNiGi5m4-mj/exec";
    let cart = {}; 
    let allProducts = [];
    let slideIndex = 0;
    let slideTimer = null;

    window.onload = function() {
      const localData = localStorage.getItem("LOCAL_PRODUCTS");
      if (localData) {
        try { 
          allProducts = JSON.parse(localData);
          renderProducts(allProducts); 
        } catch(e){}
      }
      fetchDataFromServer();
    };

    function fetchDataFromServer() {
      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleServerResponse";
      script.onerror = function() {
        setTimeout(fetchDataFromServer, 2000);
      };
      document.body.appendChild(script);
    }

    function handleServerResponse(response) {
      if (response) {
        if (response.banners && response.banners.length > 0) {
          renderBanners(response.banners);
        }

        if (response.announcement) {
          document.getElementById('announcement-text').innerText = response.announcement;
        }

        if (response.socials) {
          document.getElementById('link-fb').href = response.socials.facebook || "#";
          document.getElementById('link-tg').href = response.socials.telegram || "#";
          document.getElementById('link-line').href = response.socials.line || "#";
          document.getElementById('link-tt').href = response.socials.tiktok || "#";
          document.getElementById('link-yt').href = response.socials.youtube || "#";
        }

        if (response.products && response.products.length > 0) {
          allProducts = response.products;
          localStorage.setItem("LOCAL_PRODUCTS", JSON.stringify(response.products));
          renderProducts(response.products);
        }
      }
    }

    function renderBanners(bannerUrls) {
      const slider = document.getElementById('banner-slider');
      let html = '';
      bannerUrls.forEach((url, index) => {
        html += `<div class="banner-slide ${index === 0 ? 'active' : ''}"><img src="${url}" alt="Sponsor ${index}"></div>`;
      });
      slider.innerHTML = html;

      if (slideTimer) clearInterval(slideTimer);
      if (bannerUrls.length > 1) {
        slideTimer = setInterval(() => {
          const slides = document.querySelectorAll('.banner-slide');
          if (slides.length > 0) {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
          }
        }, 3500); // ផ្លាស់ប្តូរស្លាយរៀងរាល់ 3.5 វិនាទី
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('main-content');
      if (!products || products.length === 0) {
        container.innerHTML = "<div class='loading'>គ្មានទំនិញក្នុងស្តុកឡើយ</div>";
        return;
      }

      const categories = {};
      products.forEach(p => {
        let cat = p.category ? p.category.toString().trim() : 'ទំនិញទូទៅ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      let fullHtml = '';
      for (let catName in categories) {
        fullHtml += `
          <div class="section-container">
            <div class="section-title"><i>${catName}</i></div>
            <div class="product-grid">
        `;
        categories[catName].forEach(p => {
          let imgUrl = p.image && p.image.toString().startsWith('http') ? p.image : 'https://picsum.photos/300/300';
          let descText = (p.description && p.description !== "-") ? p.description : '';
          let pId = p.id;
          let qty = cart[pId] ? cart[pId].qty : 0;

          fullHtml += `
            <div class="product-card">
              <div class="image-wrapper"><img src="${imgUrl}" alt="${p.name}" loading="lazy"></div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                ${descText ? `<div class="product-desc">${descText}</div>` : ''}
                <div class="price-tag">$${p.price}</div>
              </div>
              <div id="btn-container-${pId}" style="width:100%;">
                ${renderButtonHtml(pId, p.name, p.price, imgUrl, qty)}
              </div>
            </div>
          `;
        });
        fullHtml += `</div></div>`;
      }
      container.innerHTML = fullHtml;
    }

    function renderButtonHtml(id, name, price, img, qty) {
      if (qty > 0) {
        return `
          <div class="qty-control">
            <button class="btn-qty" onclick="changeQty('${id}', '${name}', ${price}, '${img}', -1)">-</button>
            <span class="qty-number">${qty}</span>
            <button class="btn-qty" onclick="changeQty('${id}', '${name}', ${price}, '${img}', 1)">+</button>
          </div>
        `;
      } else {
        return `<button class="btn-add-cart" onclick="changeQty('${id}', '${name}', ${price}, '${img}', 1)">+ ថែមចូលកន្ត្រក</button>`;
      }
    }

    function changeQty(id, name, price, img, delta) {
      if (!cart[id]) {
        cart[id] = { name: name, price: Number(price), img: img, qty: 0 };
      }
      
      cart[id].qty += delta;

      if (cart[id].qty <= 0) {
        delete cart[id];
      }

      const btnContainer = document.getElementById('btn-container-' + id);
      if (btnContainer) {
        let currentQty = cart[id] ? cart[id].qty : 0;
        btnContainer.innerHTML = renderButtonHtml(id, name, price, img, currentQty);
      }

      updateCartSummary();
    }

    function updateCartSummary() {
      let totalCount = 0;
      let totalPrice = 0;
      let cartItemsHtml = '';

      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartItemsHtml = '<div class="empty-cart-msg">មិនទាន់មានទំនិញក្នុងកន្ត្រកឡើយ</div>';
      } else {
        keys.forEach(key => {
          let item = cart[key];
          let itemSubtotal = item.qty * item.price;
          totalCount += item.qty;
          totalPrice += itemSubtotal;

          cartItemsHtml += `
            <div class="cart-item-row">
              <img src="${item.img}" class="cart-item-img" alt="${item.name}">
              <div class="cart-item-details">
                <div class="cart-item-title">${item.name}</div>
                <div class="cart-item-price-info">$${item.price} x ${item.qty}</div>
              </div>
              <div class="cart-item-subtotal">$${itemSubtotal}</div>
            </div>
          `;
        });
      }

      document.getElementById('cart-items-list').innerHTML = cartItemsHtml;
      document.getElementById('cart-count').innerText = totalCount;
      document.getElementById('cart-total').innerText = '$' + totalPrice;
    }

    function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      if (!name || !phone) return alert("សូមបញ្ចូលឈ្មោះ និងលេខទូរស័ព្ទ!");

      let itemsArray = [];
      let totalPrice = 0;

      for (let key in cart) {
        itemsArray.push(cart[key].name + " (x" + cart[key].qty + ")");
        totalPrice += cart[key].qty * cart[key].price;
      }

      if (itemsArray.length === 0) return alert("សូមបន្ថែមទំនិញចូលកន្ត្រកមុនបញ្ជូន!");

      const itemsText = itemsArray.join(", ");
      const btn = document.querySelector('.btn-submit');
      btn.innerText = "កំពុងបញ្ជូន...";
      btn.disabled = true;

      const orderUrl = API_URL + "?action=submitOrder&name=" + encodeURIComponent(name) + 
                       "&phone=" + encodeURIComponent(phone) + 
                       "&items=" + encodeURIComponent(itemsText) + 
                       "&totalPrice=" + encodeURIComponent(totalPrice) + 
                       "&callback=onOrderSuccess";

      const script = document.createElement('script');
      script.src = orderUrl;
      document.body.appendChild(script);
    }

    function onOrderSuccess() {
      alert("🎉 ការកុម្មង់ជោគជ័យ!");
      cart = {};
      updateCartSummary();
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      const btn = document.querySelector('.btn-submit');
      btn.innerText = "បញ្ជាទិញភ្លាមៗ";
      btn.disabled = false;
      renderProducts(allProducts);
    }
  </script>
</body>
</html>
