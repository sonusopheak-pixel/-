<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ហាងលក់ខោអាវ</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f4f4; margin: 0; padding: 8px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; }
    .section-container { background: white; border-radius: 10px; padding: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .section-title { font-size: 14px; font-weight: 800; color: #333; margin-bottom: 8px; }
    .product-grid { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
    .product-card { display: flex; flex-direction: column; align-items: center; text-align: center; background: #fff; border-radius: 8px; border: 1px solid #f0f0f0; padding: 5px; overflow: hidden; justify-content: space-between; }
    .image-wrapper { position: relative; width: 100%; padding-top: 100%; border-radius: 6px; overflow: hidden; background-color: #eee; }
    .image-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .product-info { width: 100%; margin: 4px 0; }
    .product-name { font-size: 11px; font-weight: 700; color: #222; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-desc { font-size: 9px; color: #777; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; }
    .price-tag { font-size: 13px; font-weight: 800; color: #ff4747; margin-bottom: 4px; }
    .btn-add-cart { width: 100%; background-color: #ff4747; color: white; border: none; padding: 6px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .order-box { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .order-box h3 { margin-top: 0; font-size: 14px; }
    input { width: 100%; padding: 8px; margin: 4px 0 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
    .btn-submit { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .loading { text-align: center; color: #777; padding: 15px; grid-column: 1 / -1; font-size: 12px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="main-content">
      <div class="loading">កំពុងផ្ទុកទំនិញ...</div>
    </div>

    <div class="order-box">
      <h3>🛒 បញ្ជូនការកុម្ម៉ង់ទិញ</h3>
      <div style="margin-bottom: 8px; font-size: 12px;">
        កន្ត្រក៖ <b id="cart-count">0</b> មុខ | សរុប៖ <b id="cart-total" style="color:#ff4747;">$0</b>
      </div>
      
      <label style="font-size: 11px; font-weight: bold;">ឈ្មោះរបស់អ្នក</label>
      <input type="text" id="custName" placeholder="បញ្ចូលឈ្មោះ...">

      <label style="font-size: 11px; font-weight: bold;">លេខទូរស័ព្ទ</label>
      <input type="tel" id="custPhone" placeholder="បញ្ចូលលេខទូរស័ព្ទ...">

      <button class="btn-submit" onclick="submitOrder()">បញ្ជាទិញភ្លាមៗ</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvKz4kcj-HznHfO9wsCz6MzR_mUYWP9hZiLxBDvPwm7Tr90JqZXBGxAbNiGi5m4-mj/exec";
    let cart = [];

    window.onload = function() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => renderProducts(data))
        .catch(err => {
          document.getElementById('main-content').innerHTML = "<div class='loading'>មាន Error ក្នុងការទាញយកទិន្នន័យ</div>";
        });
    };

    function renderProducts(products) {
      const container = document.getElementById('main-content');
      if (!products || products.length === 0) {
        container.innerHTML = "<div class='loading'>គ្មានទំនិញក្នុងស្តុកឡើយ</div>";
        return;
      }

      const categories = {};
      products.forEach(p => {
        let cat = p.category ? p.category.toString().trim() : 'ទំនិញទូទៅ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      let fullHtml = '';
      for (let catName in categories) {
        fullHtml += `
          <div class="section-container">
            <div class="section-title"><i>${catName}</i></div>
            <div class="product-grid">
        `;
        categories[catName].forEach(p => {
          let imgUrl = p.image && p.image.toString().startsWith('http') ? p.image : 'https://picsum.photos/300/300';
          let descText = (p.description && p.description !== "-") ? p.description : '';
          fullHtml += `
            <div class="product-card">
              <div class="image-wrapper"><img src="${imgUrl}" alt="${p.name}"></div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                ${descText ? `<div class="product-desc">${descText}</div>` : ''}
                <div class="price-tag">$${p.price}</div>
              </div>
              <button class="btn-add-cart" onclick="addToCart('${p.name}', ${p.price})">+ ថែមចូលកន្ត្រក</button>
            </div>
          `;
        });
        fullHtml += `</div></div>`;
      }
      container.innerHTML = fullHtml;
    }

    function addToCart(name, price) {
      cart.push({ name, price: Number(price) });
      document.getElementById('cart-count').innerText = cart.length;
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = '$' + total;
      alert("បានបន្ថែម " + name + " ទៅក្នុងកន្ត្រក!");
    }

    function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      if (!name || !phone) return alert("សូមបញ្ចូលឈ្មោះ និងលេខទូរស័ព្ទ!");
      if (cart.length === 0) return alert("សូមបន្ថែមទំនិញចូលកន្ត្រកមុនបញ្ជូន!");

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
      const itemsText = cart.map(i => i.name).join(", ");
      const btn = document.querySelector('.btn-submit');
      btn.innerText = "កំពុងបញ្ជូន...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "submitOrder", name, phone, items: itemsText, totalPrice })
      })
      .then(() => {
        alert("🎉 ការកុម្ម៉ង់ជោគជ័យ!");
        cart = [];
        document.getElementById('cart-count').innerText = '0';
        document.getElementById('cart-total').innerText = '$0';
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        btn.innerText = "បញ្ជាទិញភ្លាមៗ";
        btn.disabled = false;
      })
      .catch(() => {
        alert("🎉 ការកុម្ម៉ង់បានផ្ញើទៅកាន់រោងចក្ររួចរាល់!");
        btn.innerText = "បញ្ជាទិញភ្លាមៗ";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
