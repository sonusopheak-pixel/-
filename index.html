<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ហាងលក់ខោអាវ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: #f4f4f4; 
      margin: 0; 
      padding: 8px 8px 70px 8px !important; /* បន្ថែមលំហខាងក្រោមដើម្បីកុំឱ្យបាំង Bottom Bar */
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px; 
    }

    .banner-slider {
      position: relative;
      width: 100%;
      height: auto;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .banner-slide {
      position: relative;
      width: 100%;
      height: auto;
      display: none;
    }

    .banner-slide.active {
      display: block;
    }

    .banner-slide img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 10px;
    }

    .header-social-box {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .marquee-container {
      background-color: #fff8e7;
      border: 1px solid #ffe0b2;
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 8px;
      overflow: hidden;
      font-size: 11px;
      font-weight: bold;
      color: #d35400;
    }

    .social-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }

    .social-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      text-decoration: none;
    }

    .social-icon svg {
      width: 100%;
      height: 100%;
    }

    .section-container {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #333;
      margin-bottom: 8px;
    }

    .product-grid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 8px !important;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      align-items: center; 
      text-align: center;   
      background: #fff;
      border-radius: 8px;
      border: 1px solid #f0f0f0;
      padding: 5px;
      overflow: hidden;
      justify-content: space-between;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      overflow: hidden;
      background-color: #eee;
    }

    .image-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .product-info {
      width: 100%;
      margin: 4px 0;
    }

    .product-name {
      font-size: 11px;
      font-weight: 700;
      color: #222;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-tag {
      font-size: 13px;
      font-weight: 800;
      color: #ff4747;
      margin-bottom: 4px;
    }

    .btn-add-cart {
      width: 100%;
      background-color: #ff4747;
      color: white;
      border: none;
      padding: 6px 2px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: #fff0f0;
      border: 1px solid #ff4747;
      border-radius: 4px;
    }

    .btn-qty {
      background-color: #ff4747;
      color: white;
      border: none;
      width: 26px;
      height: 24px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .qty-number {
      font-size: 11px;
      font-weight: bold;
      color: #ff4747;
    }

    .order-box {
      background: white;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: none;
    }

    .cart-items-container {
      max-height: 200px;
      overflow-y: auto;
      border: 1px dashed #eee;
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 10px;
      background-color: #fafafa;
    }

    .cart-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    input, select { 
      width: 100%; 
      padding: 8px; 
      margin: 4px 0 10px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 13px; 
      background-color: #fff;
    }

    .btn-submit { 
      width: 100%; 
      background: #27ae60; 
      color: white; 
      border: none; 
      padding: 10px; 
      font-size: 14px; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
    }

    /* 📱 Bottom Navigation Bar (Fixed 100%) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 55px;
      background-color: #1b4d3e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.2);
      z-index: 999999 !important;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      flex: 1;
      height: 100%;
      position: relative;
    }

    .nav-item.active {
      color: #2ecc71;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 2px;
      fill: currentColor;
    }

    .badge-count {
      position: absolute;
      top: 4px;
      right: 28%;
      background-color: #ff4747;
      color: white;
      border-radius: 10px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div id="home-view">
      <div id="banner-slider" class="banner-slider">
        <div class="banner-slide active"><img src="https://picsum.photos/600/200" alt="Sponsor"></div>
      </div>

      <div class="header-social-box">
        <div class="marquee-container">
          <marquee id="announcement-text" behavior="scroll" direction="left" scrollamount="4">
            🎉 កំពុងផ្ទុកព័ត៌មាន...
          </marquee>
        </div>

        <div class="social-row">
          <span class="header-title">ទំនាក់ទំនងយើង៖</span>
          <div class="social-links">
            <a id="link-fb" href="#" target="_blank" class="social-icon" title="Facebook">
              <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </a>
            <a id="link-tg" href="https://t.me/kunros16" target="_blank" class="social-icon" title="Telegram">
              <svg viewBox="0 0 24 24" fill="#24A1DE"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.03 9.56c-.15.68-.56.84-1.13.53l-3.1-2.29-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.35-.39-.13l-7.14 4.5-3.08-.96c-.67-.21-.68-.67.14-.99l12.03-4.64c.56-.21 1.05.13.84.95z"/></svg>
            </a>
          </div>
        </div>
      </div>

      <div id="main-content">
        <div class="loading">កំពុងផ្ទុកទំនិញ...</div>
      </div>
    </div>

    <!-- 🛒 Order View -->
    <div id="order-box" class="order-box">
      <h3>🛒 បញ្ជូនការកុម្ម៉ង់ទិញ</h3>
      
      <div id="cart-items-list" class="cart-items-container">
        <div class="empty-cart-msg">មិនទាន់មានទំនិញក្នុងកន្ត្រកឡើយ</div>
      </div>

      <div style="margin-bottom: 8px; font-size: 12px; font-weight: bold; text-align: right;">
        កន្ត្រក៖ <span id="cart-count" style="color:#27ae60;">0</span> មុខ | សរុប៖ <span id="cart-total" style="color:#ff4747;">$0</span>
      </div>
      
      <label style="font-size: 11px; font-weight: bold;">ឈ្មោះរបស់អ្នក <span style="color:red;">*</span></label>
      <input type="text" id="custName" placeholder="បញ្ចូលឈ្មោះ...">

      <label style="font-size: 11px; font-weight: bold;">លេខទូរស័ព្ទ <span style="color:red;">*</span></label>
      <input type="tel" id="custPhone" placeholder="បញ្ចូលលេខទូរស័ព្ទ...">

      <label style="font-size: 11px; font-weight: bold;">អាសយដ្ឋានដឹកជញ្ជូន (Address) <span style="color:red;">*</span></label>
      <input type="text" id="custAddress" placeholder="បញ្ចូលទីតាំង/អាសយដ្ឋាន...">

      <label style="font-size: 11px; font-weight: bold;">សេវាដឹកជញ្ជូន (Delivery Service) <span style="color:red;">*</span></label>
      <select id="deliveryType">
        <option value="">-- សូមជ្រើសរើសក្រុមហ៊ុនដឹកជញ្ជូន --</option>
        <option value="J&T Express">J&T Express</option>
        <option value="វីរៈប៊ុនថាំ (Virak Buntham)">វីរៈប៊ុនថាំ (Virak Buntham)</option>
        <option value="ភ្នំពេញតាក់ស៊ី (Phnom Penh Taxi)">ភ្នំពេញតាក់ស៊ី (Phnom Penh Taxi)</option>
        <option value="ដឹកជញ្ជូនទូទៅ (General Delivery)">ដឹកជញ្ជូនទូទៅ (General Delivery)</option>
      </select>

      <button class="btn-submit" onclick="submitOrder()">បញ្ជាទិញភ្លាមៗ</button>
    </div>
  </div>

  <!-- 📱 Bottom Navigation Bar -->
  <div class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>ទំព័រដើម</span>
    </button>
    <button class="nav-item" id="nav-order" onclick="switchTab('order')">
      <span id="nav-cart-badge" class="badge-count">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span>ការកុម្ម៉ង់</span>
    </button>
    <a href="https://t.me/Narakh17" target="_blank" class="nav-item" id="nav-contact">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      <span>ទំនាក់ទំនង</span>
    </a>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvKz4kcj-HznHfO9wsCz6MzR_mUYWP9hZiLxBDvPwm7Tr90JqZXBGxAbNiGi5m4-mj/exec";
    let cart = {}; 
    let allProducts = [];
    let slideIndex = 0;
    let slideTimer = null;
    let buyerChatId = null;
    let buyerUsername = "";

    window.onload = function() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
        const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        if (tgUser) {
          if (tgUser.id) buyerChatId = tgUser.id;
          if (tgUser.username) buyerUsername = tgUser.username;
        }
      }

      const localData = localStorage.getItem("LOCAL_PRODUCTS");
      if (localData) {
        try { 
          allProducts = JSON.parse(localData);
          renderProducts(allProducts); 
        } catch(e){}
      }
      fetchDataFromServer();
    };

    function switchTab(tabName) {
      const homeView = document.getElementById('home-view');
      const orderBox = document.getElementById('order-box');
      const navHome = document.getElementById('nav-home');
      const navOrder = document.getElementById('nav-order');

      if (tabName === 'home') {
        homeView.style.display = 'block';
        orderBox.style.display = 'none';
        navHome.classList.add('active');
        navOrder.classList.remove('active');
      } else if (tabName === 'order') {
        homeView.style.display = 'none';
        orderBox.style.display = 'block';
        navHome.classList.remove('active');
        navOrder.classList.add('active');
      }
    }

    function fetchDataFromServer() {
      const script = document.createElement('script');
      script.src = API_URL + "?t=" + new Date().getTime() + "&callback=handleServerResponse";
      document.body.appendChild(script);
    }

    function handleServerResponse(response) {
      if (response) {
        if (response.banners && response.banners.length > 0) renderBanners(response.banners);
        if (response.announcement) document.getElementById('announcement-text').innerText = response.announcement;
        if (response.products) {
          allProducts = response.products;
          localStorage.setItem("LOCAL_PRODUCTS", JSON.stringify(response.products));
          renderProducts(response.products);
        }
      }
    }

    function renderBanners(bannerUrls) {
      const slider = document.getElementById('banner-slider');
      let html = '';
      bannerUrls.forEach((url, index) => {
        html += `<div class="banner-slide ${index === 0 ? 'active' : ''}"><img src="${url}" alt="Sponsor ${index}"></div>`;
      });
      slider.innerHTML = html;

      if (slideTimer) clearInterval(slideTimer);
      if (bannerUrls.length > 1) {
        slideTimer = setInterval(() => {
          const slides = document.querySelectorAll('.banner-slide');
          if (slides.length > 0) {
            slides[slideIndex].classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
          }
        }, 3500);
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('main-content');
      if (!products || products.length === 0) {
        container.innerHTML = "<div class='loading'>គ្មានទំនិញក្នុងស្តុកឡើយ</div>";
        return;
      }

      const categories = {};
      products.forEach(p => {
        let cat = p.category ? p.category.toString().trim() : 'ទំនិញទូទៅ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      let fullHtml = '';
      for (let catName in categories) {
        fullHtml += `<div class="section-container"><div class="section-title"><i>${catName}</i></div><div class="product-grid">`;
        categories[catName].forEach(p => {
          let imgUrl = p.image && p.image.toString().startsWith('http') ? p.image : 'https://picsum.photos/300/300';
          let pId = p.id;
          let qty = cart[pId] ? cart[pId].qty : 0;
          let isOutOfStock = (p.status === "OUT_OF_STOCK");

          fullHtml += `
            <div class="product-card">
              <div class="image-wrapper"><img src="${imgUrl}" alt="${p.name}" loading="lazy"></div>
              <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price-tag">$${p.price}</div>
              </div>
              <div id="btn-container-${pId}" style="width:100%;">
                ${isOutOfStock ? `<button class="btn-out-stock" disabled>អស់ស្តុក</button>` : renderButtonHtml(pId, p.name, p.price, imgUrl, qty)}
              </div>
            </div>
          `;
        });
        fullHtml += `</div></div>`;
      }
      container.innerHTML = fullHtml;
    }

    function renderButtonHtml(id, name, price, img, qty) {
      if (qty > 0) {
        return `
          <div class="qty-control">
            <button class="btn-qty" onclick="changeQty('${id}', '${name}', ${price}, '${img}', -1)">-</button>
            <span class="qty-number">${qty}</span>
            <button class="btn-qty" onclick="changeQty('${id}', '${name}', ${price}, '${img}', 1)">+</button>
          </div>
        `;
      } else {
        return `<button class="btn-add-cart" onclick="changeQty('${id}', '${name}', ${price}, '${img}', 1)">+ ថែមចូលកន្ត្រក</button>`;
      }
    }

    function changeQty(id, name, price, img, delta) {
      if (!cart[id]) cart[id] = { name: name, price: Number(price), img: img, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];

      const btnContainer = document.getElementById('btn-container-' + id);
      if (btnContainer) {
        let currentQty = cart[id] ? cart[id].qty : 0;
        btnContainer.innerHTML = renderButtonHtml(id, name, price, img, currentQty);
      }
      updateCartSummary();
    }

    function updateCartSummary() {
      let totalCount = 0;
      let totalPrice = 0;
      let cartItemsHtml = '';

      const keys = Object.keys(cart);
      if (keys.length === 0) {
        cartItemsHtml = '<div class="empty-cart-msg">មិនទាន់មានទំនិញក្នុងកន្ត្រកឡើយ</div>';
      } else {
        keys.forEach(key => {
          let item = cart[key];
          let itemSubtotal = item.qty * item.price;
          totalCount += item.qty;
          totalPrice += itemSubtotal;

          cartItemsHtml += `
            <div class="cart-item-row">
              <img src="${item.img}" class="cart-item-img" alt="${item.name}">
              <div class="cart-item-details">
                <div class="cart-item-title">${item.name}</div>
                <div class="cart-item-price-info">$${item.price} x ${item.qty}</div>
              </div>
              <div class="cart-item-subtotal">$${itemSubtotal}</div>
            </div>
          `;
        });
      }

      document.getElementById('cart-items-list').innerHTML = cartItemsHtml;
      document.getElementById('cart-count').innerText = totalCount;
      document.getElementById('cart-total').innerText = '$' + totalPrice;

      const badge = document.getElementById('nav-cart-badge');
      if (totalCount > 0) {
        badge.innerText = totalCount;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const deliveryType = document.getElementById('deliveryType').value.trim();

      if (!name) return alert("សូមបញ្ចូលឈ្មោះរបស់អ្នក!");
      if (!phone) return alert("សូមបញ្ចូលលេខទូរស័ព្ទ!");
      if (!address) return alert("សូមបញ្ចូលអាសយដ្ឋានដឹកជញ្ជូន!");
      if (!deliveryType) return alert("សូមជ្រើសរើសក្រុមហ៊ុនដឹកជញ្ជូន!");

      let itemsArray = [];
      let totalPrice = 0;
      for (let key in cart) {
        itemsArray.push(cart[key].name + " (x" + cart[key].qty + ")");
        totalPrice += cart[key].qty * cart[key].price;
      }

      if (itemsArray.length === 0) return alert("សូមបន្ថែមទំនិញចូលកន្ត្រកមុនបញ្ជូន!");

      const btn = document.querySelector('.btn-submit');
      btn.innerText = "កំពុងបញ្ជូន...";
      btn.disabled = true;

      const itemsText = itemsArray.join(", ");
      const orderUrl = API_URL + "?action=submitOrder&name=" + encodeURIComponent(name) + 
                       "&phone=" + encodeURIComponent(phone) + 
                       "&address=" + encodeURIComponent(address) + 
                       "&deliveryType=" + encodeURIComponent(deliveryType) + 
                       "&items=" + encodeURIComponent(itemsText) + 
                       "&totalPrice=" + encodeURIComponent(totalPrice) + 
                       "&buyerChatId=" + encodeURIComponent(buyerChatId || "") +
                       "&buyerUsername=" + encodeURIComponent(buyerUsername || "") +
                       "&callback=onOrderSuccess";

      const scriptOrder = document.createElement('script');
      scriptOrder.src = orderUrl;
      document.body.appendChild(scriptOrder);
    }

    function onOrderSuccess(res) {
      const btn = document.querySelector('.btn-submit');

      if (res && res.status === "blocked") {
        alert("⚠️ Your order problem, please contact seller!");
        btn.innerText = "បញ្ជាទិញភ្លាមៗ";
        btn.disabled = false;
        return;
      }

      alert("🎉 ការកុម្ម៉ង់ជោគជ័យ! វិក្កយបត្រត្រូវបានផ្ញើចូល Telegram របស់អ្នក។");
      cart = {};
      updateCartSummary();
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custAddress').value = '';
      document.getElementById('deliveryType').value = '';
      btn.innerText = "បញ្ជាទិញភ្លាមៗ";
      btn.disabled = false;
      
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.close();
      } else {
        switchTab('home');
      }
    }
  </script>
</body>
</html>
